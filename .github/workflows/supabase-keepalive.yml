name: Supabase Keep-Alive

# Projetos Supabase no plano gratuito pausam após ~7 dias sem atividade no banco.
# Esta rotina faz uma query real (que toca o Postgres) todo dia, reiniciando o timer.
# Também pode ser disparada manualmente na aba Actions do GitHub.

on:
  schedule:
    - cron: "17 8 * * *" # todo dia às 08:17 UTC (~05:17 no horário de Brasília)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query no banco (mantém o projeto ativo)
        run: |
          code=$(curl -s -o /tmp/resp -w "%{http_code}" --max-time 30 \
            "${SUPABASE_URL}/rest/v1/characters?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP $code"
          cat /tmp/resp
          echo ""
          if [ "$code" != "200" ]; then
            echo "::error::Keep-alive falhou (HTTP $code). O projeto pode estar pausado ou com problema."
            exit 1
          fi
          echo "Keep-alive OK — banco respondeu."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
